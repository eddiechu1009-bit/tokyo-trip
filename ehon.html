<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#fbf7ef" />
<title>小柴的東京大冒險 · 繪本</title>
<meta name="description" content="小柴犬豆豆帶你玩東京五日 — 給小朋友的行程繪本" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet" />
<style>
  /* ===== Noritake 風：米白底 · 黑線條 · 一點紅 · 大量留白 · 圓潤童趣 ===== */
  :root{
    --paper:#fbf7ef;      /* 米白紙 */
    --ink:#1a1a1a;        /* 黑線條/字 */
    --pop:#e4483b;        /* 跳色紅（豆豆圍巾）*/
    --sub:#8c857a;        /* 淺灰字 */
    --line:#e7e0d3;
    --r:22px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html{height:100%}
  @media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
  body{
    font-family:"Zen Maru Gothic","Noto Sans TC",system-ui,sans-serif;
    background:var(--paper);color:var(--ink);height:100dvh;overflow:hidden;
    -webkit-font-smoothing:antialiased;
    background-image:radial-gradient(var(--line) .5px, transparent .5px);
    background-size:22px 22px; /* 淡淡點點紙紋 */
  }

  /* 舞台 */
  .book{position:relative;height:100dvh;display:flex;flex-direction:column;
    max-width:620px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 18px 0}

  /* 頂列：標題 + 頁碼 */
  .top{display:flex;align-items:center;gap:10px;flex-shrink:0}
  .top .logo{font-weight:900;font-size:15px;letter-spacing:.5px}
  .top .logo .dot{color:var(--pop)}
  .top .pageno{margin-left:auto;font-size:13px;font-weight:700;color:var(--sub);
    border:2px solid var(--ink);border-radius:999px;padding:3px 11px}

  /* 頁面卡 */
  .page{flex:1;display:flex;flex-direction:column;min-height:0;padding:14px 0 8px}
  .stage{flex:1;position:relative;min-height:0;display:flex;flex-direction:column}

  /* 插圖框 */
  .art{flex:1;min-height:0;position:relative;border:3px solid var(--ink);border-radius:var(--r);
    background:#fff;overflow:hidden;display:flex;align-items:center;justify-content:center;
    box-shadow:6px 6px 0 var(--ink)}
  .art img{width:100%;height:100%;object-fit:contain;display:none}
  .art img.ready{display:block}
  /* 佔位：圖還沒生好時顯示 */
  .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;color:var(--sub);text-align:center;padding:20px}
  .ph .emoji{font-size:64px;line-height:1}
  .ph .tag{font-size:13px;font-weight:700;background:var(--paper);border:2px dashed var(--sub);
    border-radius:999px;padding:5px 14px}
  .ph .hint{font-size:11.5px;opacity:.8;max-width:220px}
  .art img.ready ~ .ph{display:none}

  /* 文字區 */
  .words{flex-shrink:0;padding:16px 4px 4px;text-align:center}
  .big{font-size:clamp(22px,6.4vw,30px);font-weight:900;line-height:1.4;letter-spacing:.5px}
  .big .em{color:var(--pop)}
  .small{margin-top:10px;font-size:13.5px;font-weight:500;color:var(--sub);line-height:1.6;
    max-width:460px;margin-left:auto;margin-right:auto}
  .small::before{content:"📖 ";}

  /* 封面 / 封底特別樣式 */
  .page.cover .art, .page.back .art{background:var(--paper)}
  .page.cover .big{font-size:clamp(26px,8vw,38px)}
  .page.cover .small::before,.page.back .small::before{content:""}

  /* 底部控制 */
  .nav{flex-shrink:0;display:flex;align-items:center;gap:12px;
    padding:10px 0 calc(14px + env(safe-area-inset-bottom))}
  .nav button{font-family:inherit;cursor:pointer;border:3px solid var(--ink);background:#fff;
    color:var(--ink);border-radius:999px;font-weight:900;transition:.15s}
  .nav button:active{transform:translate(2px,2px)}
  .nav .arrow{width:56px;height:56px;font-size:24px;flex-shrink:0;box-shadow:4px 4px 0 var(--ink)}
  .nav .arrow:disabled{opacity:.3;box-shadow:none;cursor:default}
  .nav .arrow.next{background:var(--pop);color:#fff;border-color:var(--ink)}
  /* 進度點 */
  .dots{flex:1;display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
  .dots i{width:8px;height:8px;border-radius:50%;background:var(--line);cursor:pointer;transition:.15s}
  .dots i.on{background:var(--pop);transform:scale(1.4)}

  /* 點左右翻頁的透明感應區 */
  .tapzone{position:absolute;top:0;bottom:0;width:32%;z-index:5}
  .tapzone.l{left:0}.tapzone.r{right:0}

  /* 翻頁動畫 */
  .page{animation:flip .4s ease}
  @keyframes flip{from{opacity:0;transform:translateX(var(--dir,24px)) rotateY(6deg)}to{opacity:1;transform:none}}

  /* 提示：第一次進來 */
  .swipetip{position:absolute;bottom:96px;left:50%;transform:translateX(-50%);z-index:8;
    background:var(--ink);color:#fff;font-size:12px;font-weight:700;padding:7px 14px;border-radius:999px;
    animation:fade 3s ease forwards;pointer-events:none}
  @keyframes fade{0%,70%{opacity:.9}100%{opacity:0}}
</style>
</head>
<body>

<div class="book">
  <div class="top">
    <div class="logo">🐕 小柴的東京大冒險<span class="dot">.</span></div>
    <div class="pageno"><span id="cur">1</span> / <span id="tot">12</span></div>
  </div>

  <div class="page cover" id="page">
    <div class="stage">
      <div class="art">
        <img id="art" alt="" />
        <div class="ph">
          <div class="emoji" id="emoji">🗻</div>
          <div class="tag" id="tag">封面圖</div>
          <div class="hint" id="hint">生好圖後放進 img/ 資料夾即可顯示</div>
        </div>
      </div>
      <div class="words">
        <div class="big" id="big">小柴的<span class="em">東京</span>大冒險 🗻</div>
        <div class="small" id="small"></div>
      </div>
    </div>
    <div class="tapzone l" id="tapL"></div>
    <div class="tapzone r" id="tapR"></div>
  </div>

  <div class="nav">
    <button class="arrow prev" id="prev" aria-label="上一頁">‹</button>
    <div class="dots" id="dots"></div>
    <button class="arrow next" id="next" aria-label="下一頁">›</button>
  </div>

  <div class="swipetip">👈 點兩邊或滑動翻頁 👉</div>
</div>

<script>
  // ===== 繪本內容（圖檔放 img/p0.png … img/p11.png；沒有時顯示 emoji 佔位）=====
  const PAGES = [
    {cls:'cover', img:'img/p0.png',  emoji:'🗻', tag:'封面圖',
      big:'小柴的<span class="em">東京</span>大冒險 🗻', small:'2026 / 8/25–8/29 · 一起去日本玩五天！'},
    {cls:'', img:'img/p1.png',  emoji:'✈️', tag:'Day1 · 出發',
      big:'我們坐大飛機，<span class="em">飛到日本</span>囉！✈️', small:'搭 ANA 從松山飛羽田，晚上到小田原泡溫泉。'},
    {cls:'', img:'img/p2.png',  emoji:'♨️', tag:'Day1 · 小田原溫泉',
      big:'晚上住小田原，<span class="em">泡溫泉</span>暖呼呼～♨️', small:'小田原在海邊，有城堡和好吃的魚板。今晚住車站旁的溫泉旅館。'},
    {cls:'', img:'img/p3.png',  emoji:'🏯', tag:'Day2 · 小田原城',
      big:'哇～<span class="em">好大的城堡</span>！🏯', small:'小田原城有高高的天守閣，還有忍者！爬上去可以看到大海。'},
    {cls:'', img:'img/p4.png',  emoji:'⛩️', tag:'Day2 · 箱根神社',
      big:'紅色的大門，<span class="em">站在水裡</span>耶！⛩️', small:'箱根神社的紅色鳥居站在蘆之湖上，坐船還能看到富士山。'},
    {cls:'', img:'img/p5.png',  emoji:'🗻', tag:'Day2 · 河口湖',
      big:'<span class="em">富士山</span>好高好漂亮！🗻', small:'今晚睡在富士山旁邊的河口湖，早上起床就能看到大大的富士山。'},
    {cls:'', img:'img/p6.png',  emoji:'🚡', tag:'Day3 · 纜車 & 忍野八海',
      big:'坐<span class="em">纜車</span>飛上山頂！這裡的水好清～🚡', small:'搭纜車上天上山看富士山全景；忍野八海是富士山的雪水變成的清泉。'},
    {cls:'', img:'img/p7.png',  emoji:'🚄', tag:'Day3 · 進東京',
      big:'坐新幹線，<span class="em">咻～進東京</span>！🚄', small:'還了車，坐快快的新幹線到東京，住在淺草橋連住兩晚。'},
    {cls:'', img:'img/p8.png',  emoji:'🐟', tag:'Day4 · 水族館 & 淺草',
      big:'好多魚！還有<span class="em">企鵝</span>！🐟🐧', small:'早上看葛西臨海水族館的大鮪魚和企鵝，下午去淺草雷門大燈籠。'},
    {cls:'', img:'img/p9.png',  emoji:'🥩', tag:'Day4 · 一起吃燒肉',
      big:'大家一起吃<span class="em">燒肉</span>，好香啊～🥩', small:'晚上三個家庭一起吃日本燒肉，烤得香噴噴，豆豆最開心！'},
    {cls:'', img:'img/p10.png', emoji:'👋', tag:'Day5 · 回家',
      big:'謝謝日本，<span class="em">我們下次再來</span>！👋', small:'8/29 從羽田機場搭飛機回台灣，帶著滿滿的回憶回家。'},
    {cls:'back', img:'img/p11.png', emoji:'❤️', tag:'封底',
      big:'這是我們的<span class="em">東京回憶</span> ❤️', small:'2026 夏天 · 三家人 · 六大二小的旅行'},
  ];

  let i = 0;
  const el = {
    page:document.getElementById('page'), art:document.getElementById('art'),
    emoji:document.getElementById('emoji'), tag:document.getElementById('tag'), hint:document.getElementById('hint'),
    big:document.getElementById('big'), small:document.getElementById('small'),
    cur:document.getElementById('cur'), tot:document.getElementById('tot'),
    prev:document.getElementById('prev'), next:document.getElementById('next'), dots:document.getElementById('dots'),
  };
  el.tot.textContent = PAGES.length;

  // 進度點
  PAGES.forEach((_,idx)=>{ const d=document.createElement('i'); d.onclick=()=>go(idx); el.dots.appendChild(d); });
  const dotEls=[...el.dots.children];

  function render(dir){
    const p = PAGES[i];
    el.page.className = 'page ' + (p.cls||'');
    el.page.style.setProperty('--dir', (dir<0?'-24px':'24px'));
    // reflow 觸發動畫
    void el.page.offsetWidth; el.page.style.animation='none'; void el.page.offsetWidth; el.page.style.animation='';
    el.big.innerHTML = p.big;
    el.small.textContent = p.small;
    el.emoji.textContent = p.emoji;
    el.tag.textContent = p.tag;
    // 圖：載入成功才顯示，失敗維持 emoji 佔位
    el.art.classList.remove('ready');
    el.art.removeAttribute('src'); el.art.src='';
    const img = el.art;
    img.classList.remove('ready');
    img.onload = ()=>{ img.classList.add('ready'); };
    img.onerror = ()=>{ img.classList.remove('ready'); };
    img.src = p.img;
    el.cur.textContent = i+1;
    el.prev.disabled = i===0;
    el.next.textContent = i===PAGES.length-1 ? '✓' : '›';
    dotEls.forEach((d,idx)=>d.classList.toggle('on', idx===i));
  }
  function go(n){ if(n<0||n>=PAGES.length) return; const dir=n>i?1:-1; i=n; render(dir); }
  function next(){ if(i<PAGES.length-1) go(i+1); }
  function prev(){ if(i>0) go(i-1); }

  el.next.onclick=next; el.prev.onclick=prev;
  document.getElementById('tapL').onclick=prev;
  document.getElementById('tapR').onclick=next;
  document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight')next(); if(e.key==='ArrowLeft')prev(); });
  // 滑動翻頁
  let x0=null;
  document.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});
  document.addEventListener('touchend',e=>{ if(x0==null)return; const dx=e.changedTouches[0].clientX-x0;
    if(Math.abs(dx)>50){ dx<0?next():prev(); } x0=null; });

  render(1);
</script>
</body>
</html>
